{% extends "global/base.html" %}

{% block content %}
<h2>Movimentar Estoque</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Salvar</button>
</form>

{% if messages %}
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
{% endif %}
{% endblock %}
