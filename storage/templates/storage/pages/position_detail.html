{% extends "global/base.html" %}

{% block content %}
<h2>Posição {{ position.position }}</h2>

<table border="1" cellpadding="8" cellspacing="0">
    <thead>
        <tr>
            <th>Item</th>
            <th>Quantidade</th>
            <th>Ação</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <form method="post">
                {% csrf_token %}
                <td>
                    <input type="text" id="item-search" placeholder="Buscar item...">
                    <select name="item" id="item-select" required/>
                        {% for item in items %}
                            <option value="{{ item.id }}"
                                {% if stock and stock.item.id == item.id %}selected{% endif %}>
                                {{ item.code }} - {{ item.description }}
                            </option>
                        {% endfor %}
                    </select>
                </td>
                <td>
                    <input type="number" step="0.01" name="quantity"
                        value="{{ stock.quantity|default:0 }}" min="0">
                </td>
                <td>
                    <button type="submit">Salvar</button>
                </td>
            </form>
        </tr>
    </tbody>
</table>

<p>
    <a href="{% url 'storage:storage_map' %}">← Voltar para o mapa</a>
</p>

<script>
    <script>
        const input = document.getElementById('item-search');
        const select = document.getElementById('item-select');
        
        // guarda opções
        const allOptions = Array.from(select.options);
        
        // se já tiver selecionado, mostra no input
        const selected = select.options[select.selectedIndex];
        if (selected) {
            input.value = selected.text;
        }
        
        input.addEventListener('input', function() {
            const value = this.value.toLowerCase();
        
            // tenta encontrar o melhor match
            let match = null;
        
            allOptions.forEach(option => {
                if (option.text.toLowerCase().includes(value)) {
                    if (!match) match = option;
                }
            });
        
            // se encontrou, seleciona automaticamente
            if (match) {
                select.innerHTML = '';
                select.appendChild(match);
                match.selected = true;
            }
        });
        </script>
</script>

{% endblock %}
