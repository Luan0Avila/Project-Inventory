{% extends "global/base.html" %}

{% block content %}
<h2>Posição {{ position.position }}</h2>

<table border="1" cellpadding="8" cellspacing="0">
    <thead>
        <tr>
            <th>Item</th>
            <th>Quantidade</th>
            <th>Ação</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <form method="post">
                {% csrf_token %}
                <td>
                    <select name="item" required>
                        {% for item in items %}
                            <option value="{{ item.id }}"
                                {% if stock and stock.item.id == item.id %}selected{% endif %}>
                                {{ item.code }} - {{ item.description }}
                            </option>
                        {% endfor %}
                    </select>
                </td>
                <td>
                    <input type="number" step="0.01" name="quantity"
                           value="{{ stock.quantity|default:0 }}" min="0">
                </td>
                <td>
                    <button type="submit">Salvar</button>
                </td>
            </form>
        </tr>
    </tbody>
</table>

<p>
    <a href="{% url 'storage:storage_map' %}">← Voltar para o mapa</a>
</p>
{% endblock %}
