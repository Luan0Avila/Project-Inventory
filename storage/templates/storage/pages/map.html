{% extends "global/base.html" %}

{% block content %}
<h2>Mapa de Estoque</h2>

<div class="grid">
    {% for position in positions %}
        <a href="{% url 'storage:position_detail' position.id %}"
            class="cell {% if position.has_stock %}occupied{% else %}free{% endif %}">
            {{ position.position }}
        </a>
    {% endfor %}
</div>
{% endblock %}
