{% include './partials/head.html' %}

<header class="app-header">
    <h1 class="app-title">Inventory</h1>

    <nav>
            {% if request.resolver_match.url_name != 'storage_home' %}
                <a href="{% url 'storage:storage_home' %}" class="button">
                    ← Back
                </a>
            {% endif %}
            {% if not user.is_authenticated %}
                <a href="{% url 'user:login_view' %}" class="button">
                    Login
                </a>
                <a href="{% url 'user:register_view' %}" class="button">
                    Register
                </a>
            {% endif %}
        </nav>
</header>

<main class="app-content">
    {% include "global/partials/messages.html" %}
    {% block content %}{% endblock content %}
</main>
